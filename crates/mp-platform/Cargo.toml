[package]
name = "mp-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

# Windows：直接使用 wintun crate（tun 0.6.1 的 async 层存在持锁无限期阻塞 +
# 每次 poll 起线程的缺陷，真机实测导致整个 tokio runtime 冻结 —— 见
# crates/mp-platform/src/adapter.rs 的 Windows 实现注释）
[target.'cfg(windows)'.dependencies]
wintun = "0.5"
# GetAdaptersAddresses：无子进程查接口索引（spawn route print 曾在
# 路由风暴中永久卡死 —— freeze_auto.txt 2026-11-14 实证）
windows-sys = { version = "0.52", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
] }

# 非 Windows：继续用 tun crate（utun/tun 设备）
[target.'cfg(not(windows))'.dependencies]
tun = { workspace = true, features = ["async"] }
