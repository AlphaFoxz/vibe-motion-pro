[package]
name = "mp-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# OS 凭据管理器（Windows 凭据管理器 / macOS Keychain / Linux Secret Service）
keyring = { version = "3", default-features = false, features = [
    "windows-native",
    "apple-native",
    "sync-secret-service",
] }
mp-ipc = { workspace = true }

# Windows：ShellExecuteW runas 提权拉起 daemon sidecar（UAC）。
# 版本与 mp-platform/mp-daemon 对齐（0.52）；该 API 的 feature 门：
# Win32_Foundation + Win32_UI_WindowsAndMessaging（参数/返回类型所在模块）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
