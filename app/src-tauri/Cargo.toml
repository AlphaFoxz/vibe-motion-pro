[package]
name = "mp-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
# 应用内自更新（plan-auto-update.md）；pubkey 对应私钥由维护者离线保管
tauri-plugin-updater = "2"
# Linux 检查更新引导：打开 Release 下载页（plan-auto-update.md P4）
tauri-plugin-opener = "2"
# Linux(deb) 版本检查：拉取 latest.json 并做 semver 比较（updater 插件的
# check 在 Linux 上要求 AppImage 环境，deb 走此轻量通道）
ureq = { version = "2", default-features = false, features = ["tls"] }
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# tracing subscriber（stdout + 环形日志缓冲）统一由 mp_ipc::log::init 安装
# OS 凭据管理器（Windows 凭据管理器 / macOS Keychain / Linux Secret Service）
keyring = { version = "3", default-features = false, features = [
    "windows-native",
    "apple-native",
    "sync-secret-service",
] }
mp-ipc = { workspace = true }

# Windows：ShellExecuteW runas 提权拉起 daemon sidecar（UAC）。
# 版本与 mp-platform/mp-daemon 对齐（0.52）；该 API 的 feature 门：
# Win32_Foundation + Win32_UI_WindowsAndMessaging（参数/返回类型所在模块）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
