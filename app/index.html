<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>MotionPro</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1 id="appTitle">MotionPro</h1>
        <span id="status-badge" class="badge disconnected">-</span>
        <select id="lang-select" title="Language"></select>
      </header>

      <main>
        <section id="login-panel">
          <label><span id="server-label">Server</span> <input id="server" /></label>
          <label><span id="username-label">Username</span> <input id="username" /></label>
          <label><span id="password-label">Password</span> <input id="password" type="password" /></label>
          <button id="btn-connect">Connect</button>
          <button id="btn-disconnect">Disconnect</button>
        </section>

        <section id="profiles-panel">
          <h2 id="profiles-title">Profiles</h2>
          <ul id="profiles-list"></ul>
          <input id="profile-name" placeholder="Profile name" />
          <input id="profile-host" placeholder="vpn.example.com" />
          <button id="btn-add-profile">Add</button>
        </section>

        <section id="session-info">
          <div><span id="session-label">Session</span>：<span id="session-id">-</span></div>
          <div><span id="server-ip-label">Server IP</span>：<span id="server-ip">-</span></div>
        </section>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
