name: Release
# 发布流程：在 master 上打 tag（v*）并推送后触发。
# prepare 校验 → build 双平台打包 → release 汇总发布 GitHub Release，
# 并用 git-cliff 按约定式提交自动生成改动日志：
#   - 全量 CHANGELOG.md 回写 master（cliff.toml 定义分组规则）
#   - 本次版本改动作为 Release 正文
# （ci.yml 只挂 branches 过滤，tag 推送不会误触 CI。）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 前置校验：tag 必须指向 master 上的提交，且与 tauri.conf.json 的版本一致。
  # 提前失败，避免白跑十几分钟的编译后再发现版本对不上。
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag 必须在 master 上
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::tag ${GITHUB_REF_NAME} 不在 master 上，拒绝发布"
            exit 1
          fi
      - name: tag 版本须与 tauri.conf.json 一致
        run: |
          conf_version=$(jq -r '.version' app/src-tauri/tauri.conf.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${tag_version}" != "${conf_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 tauri.conf.json 版本 ${conf_version} 不一致，请先更新版本号"
            exit 1
          fi

  # 与 ci.yml 的 bundle 同一套构建方式（不签名）；产物先传 artifact，
  # 由 release 任务统一汇总，避免矩阵双任务并发创建 Release 的竞态。
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    needs: prepare
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install webkit deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tauri.conf.json 的 bundle.resources 引用 app/src-tauri/sidecar/——
      # Windows：daemon 提权拉起随 UI 存亡（plan-release.md P1）；wintun.dll 同目录
      - name: prepare sidecar (windows)
        if: runner.os == 'Windows'
        run: pwsh ./scripts/prepare-sidecar.ps1
      - name: bundle (windows)
        if: runner.os == 'Windows'
        working-directory: app
        run: |
          pnpm install --registry=https://registry.npmjs.org
          pnpm tauri build --bundles nsis
      - name: bundle (linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          pnpm install --registry=https://registry.npmjs.org
          pnpm tauri build --bundles deb,appimage
      # daemon 以 systemd 服务注入 deb（plan-release.md P2）；tauri 直出的
      # sidecar 资源副本（占位 daemon/wintun）由注入脚本清理
      - name: inject systemd service into deb (linux)
        if: runner.os == 'Linux'
        run: |
          cargo build -p mp-daemon --release
          for deb in target/release/bundle/deb/*.deb; do
            bash scripts/deb-inject-service.sh "$deb" target/release/mp-daemon
          done
          ls -la target/release/bundle/deb/
      # macOS 暂缓（当前只发 win/linux）。恢复时矩阵加回 macos-latest，
      # 补 bundle (macos) 步骤（参见 ci.yml 注释），并在 artifact path 加 dmg/*.dmg。
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # 下载两个平台的产物，合并成一个 Release。
  # 发布前用 git-cliff 依约定式提交生成改动日志（配置见 cliff.toml）：
  # 全量 CHANGELOG.md 自动回写 master，本次版本改动作为 Release 正文。
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # git-cliff 需要完整历史与所有 tag，fetch-depth 必须为 0
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout 到的是 tag 的 detached HEAD，切回 master 以便回写 CHANGELOG.md
      - name: 切到 master
        run: git checkout master
      - name: 生成完整 CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      # --latest = 本次推送的 tag；--strip all 去掉文件头，只留本版本段落
      - name: 生成本次版本改动日志（Release 正文）
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -vv --latest --strip all
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
      # 回写改动日志到 master；若仓库开了分支保护导致推送失败，
      # 不阻断发布（改动日志已在 Release 正文中）
      - name: 回写 CHANGELOG.md 到 master
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md 无变化，跳过提交"
          else
            git commit -m "docs(changelog): ${{ github.ref_name }} 自动更新改动日志"
            git push origin HEAD:master
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          name: MotionPro ${{ github.ref_name }}
          files: dist/**
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
