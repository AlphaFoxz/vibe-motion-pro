name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # crates/*（default-members）：mp-app 之外的部分三平台无额外系统依赖
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
      - run: cargo test
  # mp-app（Tauri）：linux 需要 webkit 系统库；先出前端 dist 再编译
  # （tauri::generate_context! 在编译期嵌入 ../dist，缺产物会编译失败）
  app:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install webkit deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build frontend dist
        working-directory: app
        run: |
          pnpm install --registry=https://registry.npmjs.org
          pnpm build
      - run: cargo check -p mp-app
  # 三平台打包冒烟（不签名）：提前暴露 bundler/图标/资源问题，产物上传供人工检查。
  # 产物在根 target/（src-tauri 已并入 workspace）。签名/notarization 留待阶段4。
  bundle:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install webkit deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: bundle (windows)
        if: runner.os == 'Windows'
        working-directory: app
        run: |
          pnpm install --registry=https://registry.npmjs.org
          pnpm tauri build --bundles nsis
      - name: bundle (linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          pnpm install --registry=https://registry.npmjs.org
          pnpm tauri build --bundles deb,appimage
      - name: bundle (macos)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          pnpm install --registry=https://registry.npmjs.org
          pnpm tauri build --bundles app,dmg
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --registry=https://registry.npmjs.org
      - run: pnpm build
