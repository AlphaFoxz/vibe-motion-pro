[workspace]
resolver = "2"
members = [
    "crates/mp-core",
    "crates/mp-daemon",
    "crates/mp-platform",
    "crates/mp-ipc",
    "app/src-tauri",
]
# 日常 cargo build/test 只碰 crates/*（mp-app 还依赖前端 dist 产物；
# 其跨平台编译由 CI 的 app 任务单独覆盖）
default-members = [
    "crates/mp-core",
    "crates/mp-daemon",
    "crates/mp-platform",
    "crates/mp-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smoltcp = "0.11"
dirs = "6"
hostname = "0.4"
rand = "0.9"
tun = { version = "0.6", features = ["async"] }   # utun/tun（非 Windows）；windows 走 wintun 另配

# 内部 crate（统一从 workspace 引用，避免相对路径散落各处、版本漂移；
# mp-daemon 是纯二进制 crate 无下游，不声明在此）
mp-core = { path = "crates/mp-core" }
mp-platform = { path = "crates/mp-platform" }
mp-ipc = { path = "crates/mp-ipc" }

# 发布体积优化（tauri 模板标准项；panic 保持 unwind 不动 daemon 语义）
[profile.release]
strip = true
lto = true
codegen-units = 1
